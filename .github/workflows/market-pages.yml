name: Update daily data and deploy
on:
  push:
    branches: [main]
  schedule:
    - cron: '30 22 * * 1-5'
  workflow_dispatch:
    inputs:
      symbols:
        description: 'Additional symbols, comma separated (e.g. NVDA,AVGO)'
        required: false
        default: ''
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update completed daily bars
        env:
          EXTRA_SYMBOLS: ${{ inputs.symbols || '' }}
        run: python scripts/update_market.py --symbols "$EXTRA_SYMBOLS"
      - name: Test calculations
        run: node scripts/test-planner.js
      - name: Save data cache
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh completed daily market data'
            git push
          fi
      - uses: actions/configure-pages@v5
      - name: Package website
        run: |
          mkdir -p _site
          cp index.html app.js planner.js planner-ui.js CNAME .nojekyll _site/
          cp -r data _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
