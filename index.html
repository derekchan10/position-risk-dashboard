<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>仓位计算器</title>
<meta name="description" content="输入开仓价、止损价和亏损预算，计算仓位与保证金。">
<style>
:root{color-scheme:light dark;--bg:#f3f6fa;--panel:#fff;--text:#172738;--muted:#52657a;--line:#dce4ed;--accent:#165bc5;--soft:#eaf2ff;--warn:#9b4212}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 system-ui,-apple-system,sans-serif}main{max-width:960px;margin:auto;padding:40px 24px 64px}h1{font-size:30px;margin:0 0 8px}h2{font-size:20px;margin:0 0 20px}p{margin:0}.intro{color:var(--muted);margin-bottom:28px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px;margin-bottom:20px}.inputs{display:grid;grid-template-columns:1fr 1fr;gap:20px}label{display:block;font-weight:600}label span{display:block;color:var(--muted);font-size:14px;font-weight:400;margin:4px 0 8px}input,select{width:100%;min-height:48px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--text);font:inherit}input:focus,select:focus,summary:focus{outline:3px solid var(--accent);outline-offset:3px}.results{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.result{min-width:0}.caption{color:var(--muted);font-size:14px}.value{font-size:28px;font-weight:650;line-height:1.4;margin:8px 0;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}.explain{font-size:14px;color:var(--muted)}.notice{color:var(--warn);margin-top:16px}.summary-note{margin-top:20px;padding:14px;background:var(--soft);border-radius:8px;font-size:14px}summary{cursor:pointer;font-size:18px;font-weight:600;min-height:44px}details .inputs{margin-top:20px}.wide{grid-column:1/-1}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;margin-top:24px;font-size:14px}th,td{text-align:left;padding:12px 8px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}footer{font-size:14px;color:var(--muted)}#error{color:var(--warn);margin-bottom:16px}[hidden]{display:none!important}@media(max-width:650px){main{padding:24px 16px}.panel{padding:20px}.results{grid-template-columns:1fr}.result+.result{border-top:1px solid var(--line);padding-top:16px}.inputs{gap:16px}}@media(max-width:420px){.inputs{grid-template-columns:1fr}.wide{grid-column:auto}}@media(prefers-color-scheme:dark){:root{--bg:#101923;--panel:#182531;--text:#edf3fa;--muted:#b0c0d2;--line:#35485c;--accent:#83b3ff;--soft:#213851;--warn:#ffc195}}
</style>
</head>
<body><main>
<header><h1>仓位计算器</h1><p class="intro">先确定最多亏多少，再决定买多大仓位。</p></header>
<section class="panel" aria-labelledby="input-heading"><h2 id="input-heading">填这四项就能算</h2><div class="inputs">
<label>账户总资金（U）<span>你的整个交易账户有多少钱</span><input id="equity" type="number" min="0" step="any" value="3000"></label>
<label>这笔最多亏多少（U）<span>止损时，愿意承担的总损失</span><input id="risk" type="number" min="0" step="any" value="500"></label>
<label>开仓价<span>准备买入或卖出的价格</span><input id="entry" type="number" min="0" step="any" value="130"></label>
<label>止损价<span>默认做多：跌到这个价格就退出</span><input id="stop" type="number" min="0" step="any" value="124"></label>
</div></section>
<div id="error" role="alert"></div>
<section class="panel" id="output" aria-labelledby="output-heading" aria-live="polite"><h2 id="output-heading">你的计算结果</h2><div class="results">
<div class="result"><div class="caption">这笔可以买多大仓位</div><div class="value" id="notional"></div><div class="explain">杠杆后的持仓总额，不是需要投入的本金</div></div>
<div class="result"><div class="caption" id="margin-label"></div><div class="value" id="margin"></div><div class="explain">从账户中占用的本金；杠杆在高级设置调整</div></div>
<div class="result"><div class="caption">止损时预计亏损</div><div class="value" id="loss"></div><div class="explain" id="risk-note"></div></div>
</div><p class="notice" id="warning"></p><p class="summary-note" id="simple-note"></p></section>
<details class="panel"><summary>高级设置</summary><div class="inputs">
<label>交易方向<select id="side"><option value="long">做多</option><option value="short">做空</option></select></label>
<label>使用几倍杠杆<input id="leverage" type="number" min="1" step="any" value="5"></label>
<label>本笔可用保证金（U）<span>留空：按账户总资金计算</span><input id="available" type="number" min="0" step="any" placeholder="默认全部账户资金"></label>
<label>止损损失占保证金上限（%）<span>只是预算检查，不代表不会强平</span><input id="cap" type="number" min="0" max="100" step="any" value="80"></label>
<label>开仓手续费率（%）<input id="feeIn" type="number" min="0" step="any" value="0"></label>
<label>平仓手续费率（%）<input id="feeOut" type="number" min="0" step="any" value="0"></label>
<label>止损不利滑点（%）<input id="slip" type="number" min="0" step="any" value="0"></label>
<label>资金费等其他费用预留（U）<input id="reserve" type="number" min="0" step="any" value="0"></label>
<label>数量步长（基础资产单位）<span>0表示不取整；合约张数需按平台规格换算</span><input id="step" type="number" min="0" step="any" value="0"></label>
<label>平台预估强平价（可选）<span>需对应相同仓位、方向、杠杆及逐仓保证金</span><input id="liquidation" type="number" min="0" step="any" placeholder="填写平台显示的价格"></label>
</div><p class="summary-note" id="advanced-note"></p><div class="table-wrap"><table><thead><tr><th>杠杆</th><th>所需保证金</th><th>止损损失／保证金</th><th>预算检查</th></tr></thead><tbody id="rows"></tbody></table></div><p class="notice" id="liq-note"></p></details>
<footer>适用于线性U本位合约及等效股票仓位，不适用于期权、反向合约。价格使用同一计价单位。默认不计费用与滑点，请在高级设置填写实际值。止损不保证成交价；本工具不计算强平价，也不推荐最佳杠杆。输入只保存在当前浏览器。</footer>
</main><script src="app.js"></script></body></html>
