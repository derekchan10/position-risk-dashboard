name: Test and deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Test calculations
        run: node scripts/test-planner.js
      - uses: actions/configure-pages@v5
      - name: Package website
        run: |
          mkdir -p _site
          cp index.html app.js planner.js planner-ui.js CNAME .nojekyll _site/
      - name: Archive Pages artifact
        run: tar --dereference --hard-dereference -cf "$RUNNER_TEMP/artifact.tar" -C _site .
      - uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
